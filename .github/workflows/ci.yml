name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: Backend Typecheck & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mediainfotech-Server/package-lock.json

      - name: Install Dependencies
        run: |
          cd Mediainfotech-Server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd Mediainfotech-Server
          npx prisma generate

      - name: Run TypeScript Check
        run: |
          cd Mediainfotech-Server
          npx tsc --noEmit

  frontend-check:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Mediainfotech-Web/package-lock.json

      - name: Install Dependencies
        run: |
          cd Mediainfotech-Web
          npm ci

      - name: Run TypeScript Check
        run: |
          cd Mediainfotech-Web
          npx tsc --noEmit

      - name: Build Next.js Web App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          cd Mediainfotech-Web
          npm run build
